name: Olive oil data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1'
  push:
    paths:
      - '.github/workflows/olive-oil-data.yml'
permissions:
  contents: write
concurrency:
  group: olive-oil-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python olive-oil-monitor/update_data.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olive-oil-monitor/data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh olive oil customs statistics'
            git pull --rebase origin main
            git push origin main
          fi
