<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SETFOODS | Private Terminal</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f2f5f7;color:#142e45}header{background:#142e45;color:white;padding:24px}header small{color:#cbb17c}main{max-width:1250px;margin:24px auto;padding:16px}section{background:white;padding:24px;border-radius:8px;margin-bottom:16px}input,button{font:inherit;padding:12px;margin:5px;border:1px solid #aab8c4;border-radius:5px}button{background:#142e45;color:white;cursor:pointer}nav{display:flex;flex-wrap:wrap}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd;vertical-align:top}#records{overflow:auto}#message{white-space:pre-wrap} [hidden]{display:none!important}</style><header><h1>SETFOODS.</h1><small>COMMODITY INTELLIGENCE TERMINAL · PRIVATE WORKSPACE</small></header><main><section id="login"><h2>Acceso privado</h2><input id="email" type="email" placeholder="Correo corporativo"><input id="password" type="password" placeholder="Contraseña"><button id="sign">Ingresar</button><button id="reset">Recuperar / establecer contraseña</button></section><section id="recovery" hidden><h2>Establecer contraseña</h2><input id="newpass" type="password" placeholder="Nueva contraseña (mín. 12 caracteres)"><button id="savepass">Guardar contraseña</button></section><p id="message" role="status"></p><section id="workspace" hidden><h2>Inteligencia comercial · Brasil</h2><button id="logout">Cerrar sesión</button><nav id="nav"></nav><h3 id="heading"></h3><input id="filter" placeholder="Filtrar registros"><div id="records"></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://zubvsjqlgghmkwuirqtx.supabase.co','sb_publishable_2_MpN_HO8yAmjkeXgzCaAQ_CBjK9NYZ');const $=id=>document.getElementById(id),msg=s=>$('message').textContent=s;let rows=[],current='buyers',recover=location.hash.includes('type=recovery')||location.hash.includes('type=invite');const modules={buyers:'Compradores',suppliers:'Proveedores',offers:'Ofertas',opportunities:'Brokerage',trade:'Comercio exterior'};function render(){const q=$('filter').value.toLowerCase();const data=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));const root=$('records');root.replaceChildren();if(!data.length){root.textContent='Sin registros disponibles.';return}const cols=Object.keys(data[0]).filter(k=>k!=='id');const table=document.createElement('table'),head=table.insertRow();for(const k of cols){const th=document.createElement('th');th.textContent=k;head.append(th)}for(const r of data){const tr=table.insertRow();for(const k of cols)tr.insertCell().textContent=r[k]??'—'}root.append(table)}async function load(k){current=k;$('heading').textContent=modules[k];rows=[];render();const {data,error}=await db.from('scit_'+k).select('*').limit(1000);if(current!==k)return;if(error){msg(error.message);return}rows=data;render();msg('Registros consultados: '+rows.length)}async function show(session){$('workspace').hidden=true;$('login').hidden=!!session;$('recovery').hidden=true;if(!session)return;if(recover){$('recovery').hidden=false;return}const {data,error}=await db.from('scit_members').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){msg('Cuenta sin autorización.');await db.auth.signOut();return}$('workspace').hidden=false;await load(current)}for(const [k,v] of Object.entries(modules)){const b=document.createElement('button');b.textContent=v;b.onclick=()=>load(k);$('nav').append(b)}$('filter').oninput=render;$('sign').onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)msg(error.message);else await show(data.session)};$('reset').onclick=async()=>{const {error}=await db.auth.resetPasswordForEmail($('email').value,{redirectTo:location.origin+location.pathname});msg(error?error.message:'Revisa tu correo para establecer la contraseña.')};$('savepass').onclick=async()=>{if($('newpass').value.length<12){msg('Usa al menos 12 caracteres.');return}const {error}=await db.auth.updateUser({password:$('newpass').value});$('newpass').value='';if(error){msg(error.message);return}recover=false;await show((await db.auth.getSession()).data.session)};$('logout').onclick=async()=>{await db.auth.signOut();rows=[];render();await show(null);msg('Sesión cerrada')};db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')recover=true;setTimeout(()=>show(session),0)});await show((await db.auth.getSession()).data.session);
