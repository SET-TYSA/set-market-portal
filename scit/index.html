<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SETFOODS | AI Command Center</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f2f5f7;color:#142e45}header{background:#142e45;color:white;padding:24px}header small{color:#cbb17c}main{max-width:1250px;margin:24px auto;padding:16px}section{background:white;padding:24px;border-radius:8px;margin-bottom:16px}input,button{font:inherit;padding:12px;margin:5px;border:1px solid #aab8c4;border-radius:5px}button{background:#142e45;color:white;cursor:pointer}nav{display:flex;flex-wrap:wrap}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd;vertical-align:top}#records{overflow:auto}#message{white-space:pre-wrap} [hidden]{display:none!important}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.metric{border:1px solid #dce3e8;border-radius:8px;padding:18px}.metric strong{display:block;font-size:30px;margin-top:8px}.metric small{color:#52677a}.panel{margin:20px 0;padding:18px;border:1px solid #dce3e8;border-radius:8px}.bar{height:8px;background:#e7edf1;border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:#287d73}a{color:#185c83}nav button{font-size:14px}#records{min-height:160px}</style><header><h1>SETFOODS.</h1><small>AI COMMAND CENTER · PRIVATE WORKSPACE</small></header><main><section id="login"><h2>Acceso privado</h2><input id="email" type="email" placeholder="Correo corporativo"><input id="password" type="password" placeholder="Contraseña"><button id="sign">Ingresar</button><button id="reset">Recuperar / establecer contraseña</button></section><section id="recovery" hidden><h2>Establecer contraseña</h2><input id="newpass" type="password" placeholder="Nueva contraseña (mín. 12 caracteres)"><button id="savepass">Guardar contraseña</button></section><p id="message" role="status"></p><section id="workspace" hidden><h2>Centro de control comercial</h2><button id="logout">Cerrar sesión</button><nav id="nav"></nav><h3 id="heading"></h3><input id="filter" placeholder="Filtrar registros"><div id="records"></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://zubvsjqlgghmkwuirqtx.supabase.co','sb_publishable_2_MpN_HO8yAmjkeXgzCaAQ_CBjK9NYZ');const $=id=>document.getElementById(id),msg=s=>$('message').textContent=s;let rows=[],current='overview',recover=location.hash.includes('type=recovery')||location.hash.includes('type=invite');const modules={overview:'Dashboard',agents:'Agentes',communications:'Comunicaciones',buyers:'Compradores',suppliers:'Proveedores',offers:'Ofertas',opportunities:'Brokerage',trade:'Comercio exterior'};function render(){const q=$('filter').value.toLowerCase();const data=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));const root=$('records');root.replaceChildren();if(!data.length){root.textContent='Sin registros disponibles.';return}const cols=Object.keys(data[0]).filter(k=>k!=='id');const table=document.createElement('table'),head=table.insertRow();for(const k of cols){const th=document.createElement('th');th.textContent=k;head.append(th)}for(const r of data){const tr=table.insertRow();for(const k of cols)tr.insertCell().textContent=r[k]??'—'}root.append(table)}function node(tag,value,parent,cls){const el=document.createElement(tag);if(cls)el.className=cls;if(value!==null)el.textContent=value;parent.append(el);return el}
function link(root,label,url){const a=node('a',label,root);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
async function overview(){const root=$('records');root.textContent='Consultando datos reales…';const keys=['buyers','suppliers','offers','opportunities','trade'];const results=await Promise.all(keys.map(k=>db.from('scit_'+k).select('*',{count:'exact',head:true})));const countries=['BR','MX','CO','DO'];const market=await Promise.all(countries.map(c=>db.from('scit_buyers').select('*',{count:'exact',head:true}).eq('country',c)));const stages=['prospect','contacted','interested','quoting','negotiating','closed'];const pipe=await Promise.all(stages.map(c=>db.from('scit_opportunities').select('*',{count:'exact',head:true}).eq('status',c)));if(current!=='overview'||$('workspace').hidden)return;root.replaceChildren();const cards=node('div',null,root,'metrics');keys.forEach((k,i)=>{const card=node('div',null,cards,'metric');node('small',modules[k],card);node('strong',results[i].error?'No disponible':String(results[i].count??0),card)});const m=node('div',null,root,'panel');node('h3','Cobertura de compradores',m);const max=Math.max(1,...market.map(x=>x.count||0));countries.forEach((c,i)=>{node('p',({BR:'Brasil',MX:'México',CO:'Colombia',DO:'República Dominicana'})[c]+' · '+(market[i].error?'No disponible':market[i].count),m);const bar=node('div',null,m,'bar');node('span',null,bar).style.width=(100*(market[i].count||0)/max)+'%'});const p=node('div',null,root,'panel');node('h3','Pipeline de oportunidades registradas',p);stages.forEach((c,i)=>node('p',c+' · '+(pipe[i].error?'No disponible':pipe[i].count),p));node('small','Los estados no clasificados se incluyen en el total de oportunidades, no en estas etapas.',p);node('p','Actualizado: '+new Date().toLocaleString('es-CL'),root);msg('Dashboard consultado.')}
function special(k){const root=$('records');root.replaceChildren();if(k==='agents'){node('h3','Supervisión de agentes',root);for(const a of ['Brasil · 07:00','LATAM · alrededor de 08:00','Sourcing · alrededor de 09:00']){const p=node('div',null,root,'panel');node('strong',a,p);node('p','Programación prevista: diaria hasta el 10/12/2026. Estado de ejecución no sincronizado.',p)}link(root,'Consultar ejecuciones e informes en ChatGPT','https://chatgpt.com/tasks')}else{node('h3','Centro de comunicaciones',root);node('p','Revisión y aprobación manual. Los mensajes y estados de envío aún no se sincronizan con Supabase.',root);for(const [label,url] of [['Borradores pendientes','https://mail.google.com/mail/u/0/#drafts'],['Enviados','https://mail.google.com/mail/u/0/#sent'],['Bandeja de entrada','https://mail.google.com/mail/u/0/#inbox']]){const p=node('p',null,root);link(p,label,url)}node('p','Seleccionar sales@setfoods.cl antes de enviar; solo días hábiles y con aprobación.',root)}msg('')}
async function load(k){if(['overview','agents','communications'].includes(k)){current=k;$('heading').textContent=modules[k];$('filter').hidden=true;if(k==='overview')await overview();else special(k);return}$('filter').hidden=false;current=k;$('heading').textContent=modules[k];rows=[];render();const {data,error}=await db.from('scit_'+k).select('*').limit(1000);if(current!==k)return;if(error){msg(error.message);return}rows=data;render();msg('Registros consultados: '+rows.length)}async function show(session){$('workspace').hidden=true;$('login').hidden=!!session;$('recovery').hidden=true;if(!session)return;if(recover){$('recovery').hidden=false;return}const {data,error}=await db.from('scit_members').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){msg('Cuenta sin autorización.');await db.auth.signOut();return}$('workspace').hidden=false;await load(current)}for(const [k,v] of Object.entries(modules)){const b=document.createElement('button');b.textContent=v;b.onclick=()=>load(k);$('nav').append(b)}$('filter').oninput=render;$('sign').onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)msg(error.message);else await show(data.session)};$('reset').onclick=async()=>{const {error}=await db.auth.resetPasswordForEmail($('email').value,{redirectTo:location.origin+location.pathname});msg(error?error.message:'Revisa tu correo para establecer la contraseña.')};$('savepass').onclick=async()=>{if($('newpass').value.length<12){msg('Usa al menos 12 caracteres.');return}const {error}=await db.auth.updateUser({password:$('newpass').value});$('newpass').value='';if(error){msg(error.message);return}recover=false;await show((await db.auth.getSession()).data.session)};$('logout').onclick=async()=>{await db.auth.signOut();rows=[];render();await show(null);msg('Sesión cerrada')};db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')recover=true;setTimeout(()=>show(session),0)});await show((await db.auth.getSession()).data.session);
</script></html>
